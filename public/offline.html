<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>O'Globo Cargo</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; box-sizing: border-box;
    background: linear-gradient(135deg, #0d2338, #1d4f86, #14314f);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff; text-align: center;
  }
  .card { max-width: 360px; }
  .logo {
    width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1d4f86, #2c629b);
    font-weight: 900; font-size: 20px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: rgba(255,255,255,0.7); font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
  button {
    background: #fff; color: #14314f; border: none; padding: 10px 20px;
    border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">OG</div>
    <h1>You're offline / Sin conexión</h1>
    <p>
      Can't reach O'Globo Cargo right now. Check your connection and try again.<br />
      No podemos conectar con O'Globo Cargo. Revisa tu conexión e intenta de nuevo.
    </p>
    <button onclick="location.reload()">Retry / Reintentar</button>
  </div>
</body>
</html>
